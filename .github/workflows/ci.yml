name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: fmt / clippy / test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Formatting
        run: cargo fmt --all -- --check
      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings
      - name: Tests
        run: cargo test --all

  # The Linux runner is not a second copy of the job above. It is the only place
  # the non-Windows paths are ever compiled: `ocr::platform_engine` returns
  # None there, so the ONNX fallback is the default engine on Linux and the
  # `cfg(not(windows))` arms are dead code until something compiles them. This
  # job exists so that "works on any platform" is checked rather than asserted.
  linux:
    name: fmt / clippy / test (linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Formatting
        run: cargo fmt --all -- --check
      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings
      - name: Tests
        run: cargo test --all

  # The macOS runner is where the Vision adapter is actually proved.
  #
  # `ocr/vision.rs` is `#[cfg(target_os = "macos")]`, so it is not compiled by
  # the Windows or Linux jobs at all — neither can see it. This job is the only
  # place that code exists, which makes it the only thing standing between a
  # plausible-looking adapter and one that has never been run. macos-14 is
  # arm64, which is what current Macs are.
  #
  # There is no `continue-on-error` and no `|| true`. An adapter that cannot
  # compile is a failing build, not a warning: "works on macOS" is a claim in
  # the README, and this is what keeps it true.
  macos:
    name: fmt / clippy / test (macos)
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Formatting
        run: cargo fmt --all -- --check
      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings
      - name: Tests
        # Includes the Vision smoke test, which reads the committed fixture and
        # asserts non-empty text. macos-latest runners have Vision available,
        # so unlike the Windows language-pack tests this one cannot pass
        # vacuously.
        run: cargo test --all

  # The one gate that needs the network: re-verifying that a SHA-256 in
  # models/lock.json still matches what the source actually serves. It is
  # #[ignore]d in the normal suite, so without this step a pin is only ever as
  # trustworthy as the day somebody wrote it down. It checks one pin (a
  # preprocessor JSON, not a weight file), which is more than nothing and less
  # than the ticket implied â€” recorded in .scratch ticket 03.
  #
  # This names the test rather than running `--ignored`. `#[ignore]` here means
  # "needs a local model set", and the image-arm benchmarks need 213 MB and the
  # captioning benchmark needs 502 MB, neither of which this runner has. A
  # blanket `--ignored` therefore fails on tests that were never part of this
  # job, and a failing pin check becomes indistinguishable from a missing
  # download. One test, named, is the gate.
  pins:
    name: pinned checksums vs upstream
    runs-on: windows-latest
    needs: check
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Re-verify pinned checksums
        run: cargo test --all --test models -- --ignored the_pinned_checksums_still_match_upstream

  # Note for whoever reads this log: the Windows OCR adapter tests print
  # "skipping: no Windows OCR language pack" and return early when the runner
  # has no pack installed, so they pass either way. A green `check` job does not
  # by itself mean the native adapter was exercised. Recorded as a known gap in
  # the ticket 04 answer rather than hidden here.
