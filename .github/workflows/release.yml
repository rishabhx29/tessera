# Release: a tag push builds the Windows installer and publishes a GitHub
# release with it. GitHub's windows-latest targets MSVC, so the GNU toolchain
# constraint documented for the dev machine (cargo-tessera.ps1) does not apply
# here — CI and the installer both build with plain cargo.
#
# The first-run model download is checksum-pinned in the binary, so the
# installer carries no model weights and stays small.

name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  bundle-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust (MSVC, stable)
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: |
            crates/core
            crates/app

      # The installer ships the ONNX runtime beside Tessera.exe, and the app
      # crate validates that resource path while it compiles. The dll arrives
      # as ort-sys's build step (`copy-dylibs`), and a warm build cache
      # restores ort-sys already compiled, so that step does not run on a
      # retry. Cleaning the one crate forces the download and the copy again.
      # Same pinned package as Cargo.lock; the prebuilt CPU build carries only
      # the main dll, and Tessera runs no shared execution provider.
      - name: Force the ort build step to run again
        run: cargo clean -p ort-sys

      - name: Build the engine so the runtime dll is in place
        shell: pwsh
        run: |
          cargo build --release -p tessera-core
          if (-not (Test-Path target/release/onnxruntime.dll)) {
            throw "onnxruntime.dll is not in target/release after the engine build"
          }
          Get-Item target/release/onnxruntime.dll | Select-Object FullName, Length

      - name: Build and bundle the NSIS installer
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: crates/app
          args: --config tauri.bundle.conf.json
          tagName: ${{ github.ref_name }}
          releaseName: "Tessera ${{ github.ref_name }}"
          releaseBody: |
            One search bar for everything your PC can't search: images,
            screenshots, PDFs and documents. Offline, free and open source.

            **Install:** download `Tessera_x64-setup.exe` below and run it. It
            installs for the current user, so Windows does not ask for an
            administrator. The installer is not code-signed yet, so SmartScreen
            may ask you to confirm: choose **More info**, then **Run anyway**.

            **First launch:** Tessera downloads its on-device models once, about
            1.6 GB, and verifies every file against a checksum pinned in the
            binary. This is the only network access the app makes. After that
            it stays offline, including at search time.

            **Then:** choose a folder, let Tessera read it, and press
            **Ctrl+Alt+T** from anywhere to search.

            Requires Windows 10 or 11 on x64. WebView2 ships with Windows 11 and
            current Windows 10; if it is missing, Tessera offers the Microsoft
            download. The same checksum is in `SHA256SUMS.txt` and
            `Tessera_x64-setup.exe.sha256`.

            Full details, the measured numbers and the privacy page:
            https://tesseraweb.vercel.app
          releaseDraft: false
          prerelease: false
          includeUpdaterJson: false

      # The asset names carry the version, which is wrong for a website link
      # that has to keep working after 0.2.0. A copy with a fixed name is
      # uploaded next to them, so /releases/latest/download/Tessera_x64-setup.exe
      # always answers with the newest build.
      - name: Checksums and stable asset names
        shell: pwsh
        run: |
          $dir = @("target/release/bundle/nsis", "crates/app/target/release/bundle/nsis") |
            Where-Object { Test-Path $_ } | Select-Object -First 1
          if (-not $dir) { throw "the NSIS bundle directory was not found" }
          $exe = Get-ChildItem $dir -Filter "Tessera_*-setup.exe" | Select-Object -First 1
          if (-not $exe) { throw "no setup executable in $dir" }
          $hash = (Get-FileHash $exe.FullName -Algorithm SHA256).Hash.ToLower()
          "$hash  $($exe.Name)" | Out-File "$dir/SHA256SUMS.txt" -Encoding ascii
          Copy-Item $exe.FullName (Join-Path $dir "Tessera_x64-setup.exe")
          "$hash  Tessera_x64-setup.exe" |
            Out-File "$dir/Tessera_x64-setup.exe.sha256" -Encoding ascii

          $tag = "${{ github.ref_name }}"
          $rel = Invoke-RestMethod -Uri "https://api.github.com/repos/${{ github.repository }}/releases/tags/$tag" -Headers @{ Authorization = "Bearer ${{ secrets.GITHUB_TOKEN }}" }
          $headers = @{ Authorization = "Bearer ${{ secrets.GITHUB_TOKEN }}"; "Content-Type": "application/octet-stream" }
          foreach ($name in @("Tessera_x64-setup.exe", "Tessera_x64-setup.exe.sha256", "SHA256SUMS.txt")) {
            $upload = "https://uploads.github.com/repos/${{ github.repository }}/releases/$($rel.id)/assets?name=$name"
            Invoke-RestMethod -Uri $upload -Method Post -Headers $headers -InFile (Join-Path $dir $name)
          }
