[package]
name = "tessera-core"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Tessera indexing and search engine"
repository.workspace = true

[[bin]]
name = "tessera"
path = "src/main.rs"

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.7", features = ["derive"] }
dirs = "7.0.0"
dunce = "1.0.5"
rusqlite = { version = "0.40.2", features = ["bundled"] }
sha1 = "0.10"
walkdir = "2.5.0"

[dev-dependencies]
tempfile = "3.27.0"
