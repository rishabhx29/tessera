[package]
name = "tessera-core"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Tessera indexing and search engine"
repository.workspace = true

[[bin]]
name = "tessera"
path = "src/main.rs"

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.7", features = ["derive"] }
dirs = "7.0.0"
dunce = "1.0.5"
rusqlite = { version = "0.40.2", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha1 = "0.10"
sha2 = "0.11"
ureq = "3"
walkdir = "2.5.0"

[dev-dependencies]
tempfile = "3.27.0"
