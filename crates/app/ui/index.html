<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Tessera</title>
    <link rel="stylesheet" href="styles/tokens.css" />
    <link rel="stylesheet" href="styles/base.css" />
    <link rel="stylesheet" href="styles/header.css" />
    <link rel="stylesheet" href="styles/library.css" />
    <link rel="stylesheet" href="styles/results.css" />
    <link rel="stylesheet" href="styles/proof.css" />
    <link rel="stylesheet" href="styles/preview.css" />
    <link rel="stylesheet" href="styles/settings.css" />
  </head>
  <body>
    <div id="app" data-view="library">
      <header class="top">
        <div class="top-row">
          <svg class="mark" viewBox="0 0 24 24" aria-hidden="true">
            <rect class="mark-q1" x="2" y="2" width="9" height="9" rx="2.6" />
            <rect class="mark-q2" x="13" y="2" width="9" height="9" rx="2.6" />
            <rect class="mark-q3" x="2" y="13" width="9" height="9" rx="2.6" />
            <rect class="mark-q4" x="13" y="13" width="9" height="9" rx="2.6" />
          </svg>
          <div class="lenses" id="lenses" role="group" aria-label="Search scope"></div>
          <div class="top-meta">
            <p class="meta" id="meta" role="status"></p>
            <button
              class="settings-key"
              id="settings-key"
              type="button"
              aria-keyshortcuts="Control+Comma"
              title="settings (ctrl ,)"
            >
              <svg viewBox="0 0 20 20" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round">
                <path d="M3.5 6h13M3.5 10h13M3.5 14h13" />
                <circle cx="7.5" cy="6" r="1.7" fill="var(--header)" />
                <circle cx="12" cy="10" r="1.7" fill="var(--header)" />
                <circle cx="6.5" cy="14" r="1.7" fill="var(--header)" />
              </svg>
              settings
            </button>
          </div>
        </div>

        <form class="field-row" id="search-form" role="search">
          <svg
            class="search-glyph"
            viewBox="0 0 20 20"
            aria-hidden="true"
            fill="none"
            stroke="currentColor"
            stroke-width="1.6"
            stroke-linecap="round"
          >
            <circle cx="9" cy="9" r="5.5" />
            <path d="M13.2 13.2 17.5 17.5" />
          </svg>
          <input
            id="query"
            type="search"
            autocomplete="off"
            spellcheck="false"
            placeholder="search your screenshots, pictures and documents"
            aria-label="Search"
            aria-controls="library-results"
            aria-autocomplete="list"
            aria-expanded="false"
            aria-keyshortcuts="Control+K"
            autofocus
          />
          <button class="clear" id="clear" type="button" aria-label="clear the search" hidden>
            <svg
              viewBox="0 0 20 20"
              aria-hidden="true"
              fill="none"
              stroke="currentColor"
              stroke-width="1.6"
              stroke-linecap="round"
            >
              <path d="M5 5l10 10M15 5 5 15" />
            </svg>
          </button>
        </form>

        <div class="notes" id="notes" role="status"></div>
      </header>

      <main class="content" id="content">
        <section id="view-library" aria-label="Library">
          <div id="library-results" role="listbox" aria-label="Results">
            <div class="wall" id="wall" role="group" aria-label="Pictures" hidden></div>
            <div class="doc-list" id="doc-list" role="group" aria-label="Documents" hidden></div>
          </div>
          <p class="wall-note" id="wall-note" hidden></p>

          <div class="miss" id="miss" hidden>
            <p class="miss-title" id="miss-title"></p>
            <p class="miss-hint" id="miss-hint"></p>
            <div class="miss-lenses" id="miss-lenses"></div>
          </div>

          <div class="first-run" id="first-run" hidden>
            <svg class="mark" viewBox="0 0 24 24" aria-hidden="true">
              <rect class="mark-q1" x="2" y="2" width="9" height="9" rx="2.6" />
              <rect class="mark-q2" x="13" y="2" width="9" height="9" rx="2.6" />
              <rect class="mark-q3" x="2" y="13" width="9" height="9" rx="2.6" />
              <rect class="mark-q4" x="13" y="13" width="9" height="9" rx="2.6" />
            </svg>
            <h1>add a folder to begin</h1>
            <p>
              Tessera reads the words inside screenshots, PDFs and documents, and
              remembers what pictures look like. Nothing leaves this machine.
            </p>
            <p class="first-run-note" id="first-run-note" hidden></p>
            <button class="primary" id="first-run-add" type="button">choose a folder</button>
          </div>
        </section>

        <section id="view-settings" aria-label="Settings" hidden></section>
      </main>

      <aside class="sheet" id="preview" aria-label="Preview" hidden>
        <header class="sheet-head">
          <div class="sheet-title">
            <h2 id="preview-name"></h2>
            <p class="sheet-path" id="preview-path"></p>
          </div>
          <button
            class="sheet-close quiet"
            id="preview-close"
            type="button"
            aria-label="close preview"
            title="close (esc)"
          >
            <kbd>esc</kbd>
          </button>
        </header>
        <div class="sheet-body" id="preview-body"></div>
        <footer class="sheet-foot">
          <span class="sheet-meta" id="preview-meta"></span>
          <button class="quiet" id="preview-reveal" type="button">show in folder</button>
        </footer>
      </aside>
    </div>

    <div class="toast" id="toast" role="alert" hidden></div>
    <script src="dev-mock.js"></script>
    <script type="module" src="js/app.js"></script>
  </body>
</html>
